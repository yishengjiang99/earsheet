e5488e3e8577bb9eefcfb54890039058ac0ebaa6cdb1b631f33717f721a0a003  BasicPitchPoly.thresholds.json  https://github.com/yishengjiang99/earsheet/releases/download/model-latest/decoder-thresholds.json
