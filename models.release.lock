# Release-ZIP swap flow (docs/finetune/IOS_MODEL_HANDOFF.md §3): the Core ML package from the
# model-latest release ZIP plus that release's decoder-thresholds.json sidecar. CI fetches this into a
# separate directory (MODELS_LOCK=models.release.lock MODELS_DIR=...) and runs the HearSheet release-model
# test against it. To ship a release model, move these two lines into models.lock in place of the three
# stock BasicPitchPoly.mlpackage/* lines and the stock sidecar line.
