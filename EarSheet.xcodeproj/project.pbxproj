			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies the pinned models (models.lock: BasicPitchPoly.mlpackage + GeneralUser-GS.sf2;\n# fetched by scripts/fetch-models into gitignored models/) into <App>.app/models/. Never committed.\n# Missing models FAIL the build, except test-only builds where OMR_MODELS_DIR or\n# TEST_RUNNER_OMR_MODELS_DIR supplies them at run time (warning, nothing bundled).\nset -eu\nSRC=\"${SRCROOT}/models\"\nLOCK=\"${SRCROOT}/models.lock\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/models\"\nnames=$(grep -Ev '^[[:space:]]*(#|$)' \"$LOCK\" | awk '{print $2}')\n[ -n \"$names\" ] || { echo \"error: no models listed in $LOCK\" >&2; exit 1; }\nmissing=\"\"\nfor n in $names; do [ -e \"$SRC/$n\" ] || missing=\"$missing $n\"; done\nif [ -n \"$missing\" ]; then\n  RUNTIME_DIR=\"${OMR_MODELS_DIR:-${TEST_RUNNER_OMR_MODELS_DIR:-}}\"\n  if [ -n \"$RUNTIME_DIR\" ]; then\n    echo \"warning: models not bundled (missing:$missing); test-only build, models from $RUNTIME_DIR at run time\"\n    exit 0\n  fi\n  echo \"error: models missing in $SRC:$missing. Run scripts/fetch-models (pinned in models.lock). Test-only builds may set OMR_MODELS_DIR instead.\" >&2\n  exit 1\nfi\nmkdir -p \"$DST\"\nfor n in $names; do\n  if [ ! -e \"$DST/$n\" ] || [ \"$SRC/$n\" -nt \"$DST/$n\" ]; then mkdir -p \"$(dirname \"$DST/$n\")\"; rm -rf \"$DST/$n\"; cp -Rp \"$SRC/$n\" \"$DST/$n\"; fi\ndone\necho \"Bundled models: $(echo $names | tr ' ' ',')\"\n";
