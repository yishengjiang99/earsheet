# AI Music Radar landing site on its own host (same docroot as https://grepawk.com/music-radar/).
# Managed from yishengjiang99/earsheet: tools/music-radar-site/nginx/music.grepawk.com.conf, installed
# by install-vhost.sh (backup, nginx -t, smoke + API check, automatic rollback) from the
# "Deploy music.grepawk.com" workflow. Edit here, not on the server.
#
# /api/* and /admin* are proxied to the music-radar-api service (127.0.0.1:8790), which expects the
# /music-radar prefix; /music-radar/* paths are also served so absolute links and redirects keep working.
# The four proxy locations below are kept byte-for-byte as they were; site-only headers (HSTS, gzip,
# caching) live in the static locations so API responses do not change.
# TLS lines are the ones certbot wrote (`certbot --nginx -d music.grepawk.com`).
server {
    server_name music.grepawk.com;

    root /var/www/music-radar;
    index index.html;
    charset utf-8;

    # Real 404 page for static paths. Proxied API/admin 404s are untouched (no proxy_intercept_errors).
    error_page 404 /404.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8790/music-radar/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8790/music-radar/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location ^~ /music-radar/api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /music-radar/admin {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location = /music-radar { return 301 /music-radar/; }
    location ^~ /music-radar/ {
        root /var/www;
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media (posters, screenshots, icons, OG image, videos): not content-hashed, so a week.
    location ~* \.(?:mp4|jpe?g|png|webp|ico|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip on;
        gzip_vary on;
        gzip_types image/svg+xml image/x-icon;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/css application/javascript text/javascript application/xml text/xml text/plain image/svg+xml;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/music.grepawk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/music.grepawk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = music.grepawk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name music.grepawk.com;
    return 404; # managed by Certbot
}
