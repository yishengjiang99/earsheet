# Snapshot of /etc/nginx/sites-available/music.grepawk.com as found on the server on 2026-10-10 (before
# this repo managed it). Used only by test-installer.sh as the starting state.
# AI Music Radar landing site on its own host (same docroot as https://grepawk.com/music-radar/).
# /api/* and /admin* are proxied to the music-radar-api service (127.0.0.1:8790), which expects the
# /music-radar prefix; /music-radar/* paths are also served so absolute links and redirects keep working.
# TLS: run `certbot --nginx -d music.grepawk.com` once DNS for music.grepawk.com points at this server.
server {
    server_name music.grepawk.com;

    root /var/www/music-radar;
    index index.html;
    charset utf-8;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8790/music-radar/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8790/music-radar/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location ^~ /music-radar/api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /music-radar/admin {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location = /music-radar { return 301 /music-radar/; }
    location ^~ /music-radar/ {
        root /var/www;
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/music.grepawk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/music.grepawk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = music.grepawk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name music.grepawk.com;
    return 404; # managed by Certbot


}
