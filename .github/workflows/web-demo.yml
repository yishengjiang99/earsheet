name: web-demo

# Builds web/ (Basic Pitch in the browser) and runs the headless transcription test.
# Deployment is to https://grepawk.com/music-hear/ via tools/web-demo/deploy-grepawk.sh.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/web-demo/**'
      - '.github/workflows/web-demo.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/web-demo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/web-demo/package-lock.json
      - name: Install
        working-directory: tools/web-demo
        run: npm ci
      - name: Build vendor bundle + pinned model into web/
        working-directory: tools/web-demo
        run: node build.mjs
      - name: Headless transcription test (WASM + WebGL)
        working-directory: tools/web-demo
        run: node test.mjs --backends=wasm,webgl --chrome="$(command -v google-chrome)"
      - name: Live mic streaming test (fake capture device, WASM)
        working-directory: tools/web-demo
        run: node test-live.mjs --backend=wasm --cases=twinkle-melody,ode-to-joy --chrome="$(command -v google-chrome)"
