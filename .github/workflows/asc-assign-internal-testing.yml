name: ASC assign Internal Testing

on:
  workflow_dispatch:
    inputs:
      build_number:
        required: true
        type: string
      create_group:
        description: Create internal group GROUP_NAME if missing and add ONLY_EMAIL (if a team user who can see the app) as a tester (create-only)
        required: false
        type: boolean
        default: false
      group_name:
        required: false
        type: string
        default: Internal
      only_email:
        description: Team user to add with create_group (other team users are never added)
        required: false
        type: string
        default: yisheng.jiang@gmail.com

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign build to Internal Testing group(s)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CREATE_GROUP: ${{ inputs.create_group }}
          GROUP_NAME: ${{ inputs.group_name }}
          ONLY_EMAIL: ${{ inputs.only_email || 'yisheng.jiang@gmail.com' }}
          BUNDLE_ID: com.ragnus.pnge
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID'].strip()
          issuer = os.environ['APP_STORE_CONNECT_ISSUER_ID'].strip()
          p8 = os.environ['APP_STORE_CONNECT_API_KEY_P8'].replace('\\n', '\n').strip()
          build_number = os.environ['BUILD_NUMBER'].strip()
          bundle_id = os.environ['BUNDLE_ID'].strip()
          now = int(time.time())
          token = jwt.encode(
            {'iss': issuer, 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'},
            p8, algorithm='ES256', headers={'kid': key_id},
          )

          def api(method, path, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com' + path,
              data=data, method=method,
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
            )
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                raw = r.read().decode() or '{}'
                return r.status, json.loads(raw)
            except urllib.error.HTTPError as e:
              err = e.read().decode()
              raise SystemExit(f'{method} {path} -> {e.code}: {err[:1200]}')

          _, apps = api('GET', f'/v1/apps?filter[bundleId]={bundle_id}')
          app_id = apps['data'][0]['id']
          print('app', app_id)

          _, builds = api('GET', f'/v1/builds?filter[app]={app_id}&filter[version]={build_number}&limit=5&sort=-uploadedDate')
          if not builds.get('data'):
            raise SystemExit(f'Build {build_number} not found')
          build = builds['data'][0]
          build_id = build['id']
          print('build', build_id, build['attributes'])

          # beta details / missing compliance
          try:
            st, detail = api('GET', f'/v1/builds/{build_id}/buildBetaDetail')
            print('buildBetaDetail', detail.get('data', {}).get('attributes'))
          except SystemExit as e:
            print('buildBetaDetail err', e)

          _, groups = api('GET', f'/v1/apps/{app_id}/betaGroups')
          for g in groups.get('data', []):
            attrs = g['attributes']
            print('group', g['id'], attrs.get('name'), 'isInternal', attrs.get('isInternalGroup'), 'hasAccess', attrs.get('hasAccessToAllBuilds'))

          if os.environ.get('CREATE_GROUP', '').lower() == 'true':
            # Idempotent, create-only: never deletes groups or testers.
            gname = (os.environ.get('GROUP_NAME') or 'Internal').strip()
            grp = next((g for g in groups.get('data', []) if g['attributes'].get('isInternalGroup') and g['attributes'].get('name') == gname), None)
            if grp:
              print('internal group exists', grp['id'], gname)
            else:
              _, created = api('POST', '/v1/betaGroups', {'data': {'type': 'betaGroups',
                'attributes': {'name': gname, 'isInternalGroup': True, 'hasAccessToAllBuilds': True},
                'relationships': {'app': {'data': {'type': 'apps', 'id': app_id}}}}})
              grp = created['data']
              print('created internal group', grp['id'], gname, grp['attributes'])
            gid = grp['id']
            # Team users who can see this app
            users, path = [], '/v1/users?limit=200'
            while path:
              _, page = api('GET', path)
              users += page.get('data', [])
              nxt = page.get('links', {}).get('next')
              path = nxt.replace('https://api.appstoreconnect.apple.com', '') if nxt else None
            _, existing = api('GET', f'/v1/betaGroups/{gid}/betaTesters?limit=200')
            have = {t['attributes'].get('email', '').lower() for t in existing.get('data', [])}
            for u in users:
              a = u['attributes']
              email = (a.get('username') or '').strip()
              visible = a.get('allAppsVisible')
              if not visible:
                _, va = api('GET', f"/v1/users/{u['id']}/visibleApps?limit=200")
                visible = any(x['id'] == app_id for x in va.get('data', []))
              print('user', a.get('firstName'), a.get('lastName'), email, 'roles', a.get('roles'), 'canSeeApp', bool(visible))
              if not visible or not email:
                continue
              # Only the owner is synced; never add the rest of the team (2026-10-03 cleanup).
              only = (os.environ.get('ONLY_EMAIL') or 'yisheng.jiang@gmail.com').strip().lower()
              if email.lower() != only:
                continue
              if email.lower() in have:
                print('  already a tester in', gname)
                continue
              try:
                st, t = api('POST', '/v1/betaTesters', {'data': {'type': 'betaTesters',
                  'attributes': {'email': email, 'firstName': a.get('firstName') or '', 'lastName': a.get('lastName') or ''},
                  'relationships': {'betaGroups': {'data': [{'type': 'betaGroups', 'id': gid}]}}}})
                print('  added tester', email, st, t['data']['id'])
              except SystemExit as e:
                print('  add tester failed', email, e)
            _, groups = api('GET', f'/v1/apps/{app_id}/betaGroups')

          # Assign to all internal groups that don't already have access to all builds
          for g in groups.get('data', []):
            attrs = g['attributes']
            if not attrs.get('isInternalGroup'):
              continue
            if attrs.get('hasAccessToAllBuilds'):
              print('skip (all builds)', attrs.get('name'))
              continue
            gid = g['id']
            # relationship add
            body = {'data': [{'type': 'builds', 'id': build_id}]}
            try:
              st, _ = api('POST', f'/v1/betaGroups/{gid}/relationships/builds', body)
              print('assigned to', attrs.get('name'), st)
            except SystemExit as e:
              print('assign result', attrs.get('name'), e)

          # Also list builds visible / beta build localizations
          internal = [g for g in groups.get('data', []) if g['attributes'].get('isInternalGroup')]
          if not internal:
            print('::warning::app has no internal TestFlight group; create one in App Store Connect (TestFlight > Internal Testing) and add testers')
          for g in internal:
            _, gb = api('GET', f"/v1/betaGroups/{g['id']}/builds?limit=50")
            print('group', g['attributes'].get('name'), 'has build', any(b['id'] == build_id for b in gb.get('data', [])), 'allBuilds', g['attributes'].get('hasAccessToAllBuilds'))
          PY
