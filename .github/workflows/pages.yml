name: web-demo-pages

# Builds web/ (Basic Pitch in the browser), runs the headless transcription test,
# and deploys web/ to GitHub Pages. The deploy job is skipped (not failed) while
# Pages is not enabled for the repo; enable it with build_type=workflow and re-run.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/web-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/web-demo/package-lock.json

      - name: Install
        working-directory: tools/web-demo
        run: npm ci

      - name: Build vendor bundle + fetch pinned model into web/
        working-directory: tools/web-demo
        run: node build.mjs

      - name: Headless transcription test (WASM + WebGL fallbacks)
        working-directory: tools/web-demo
        run: node test.mjs --backends=wasm,webgl --chrome="$(command -v google-chrome)"

      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository; skipping deploy."
          fi

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
